server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite's dev proxy does not exist in production — nginx carries /api to the
    # compose service DNS name. Path passes through unchanged (no trailing slash
    # on proxy_pass), so /api/health -> http://api:8080/api/health.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: every unknown path renders the app shell.
    location / {
        try_files $uri /index.html;
    }
}
