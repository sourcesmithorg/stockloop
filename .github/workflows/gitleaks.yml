# gitleaks.yml — secret scanning of the FULL git history.
#
# Why the CLI and not gitleaks/gitleaks-action: the action requires a
# GITLEAKS_LICENSE for organization-owned repos, and this repository belongs
# to the `sourcesmithorg` organization. The standalone CLI has no licensing
# constraint. The exact released version and its SHA-256 checksum are pinned
# in this file; the checksum is verified before the binary is executed.
#
# Scans every commit (`gitleaks git` with `--log-opts=--all`), not just the
# PR diff. Configuration: .gitleaks.toml, which extends the default ruleset
# and allowlists only the documented `change-me-locally` placeholder
# assignments — each entry justified inline there.
#
# The scan step exits non-zero when a real secret is found, failing the job.

name: Gitleaks

on:
  push:
  pull_request:
  schedule:
    - cron: "23 4 * * 1" # weekly, Monday 04:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scan history for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every commit, for --log-opts=--all

      - name: Install gitleaks v8.30.1 (SHA-256 verified)
        run: |
          version=8.30.1
          tarball="gitleaks_${version}_linux_x64.tar.gz"
          curl -fsSL -o "${tarball}" "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${tarball}"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  ${tarball}" | sha256sum -c -
          tar xzf "${tarball}"
          ./gitleaks version

      - name: Scan all commits with .gitleaks.toml
        run: ./gitleaks git . --config .gitleaks.toml --log-opts=--all --redact --no-banner
