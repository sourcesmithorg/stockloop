# quality.yml — repository hygiene gates that are meaningful today.
#
# Kept out of ci.yml deliberately: ci.yml guards app scaffolds and must stay
# green-by-construction until web/ and api/ exist, while these jobs exercise
# the repo itself and run at full strength from day one.
#
#   * actionlint  — validates every file under .github/workflows/ (runs
#                   today; tool versions are pinned and checksum-verified).
#   * markdownlint — lints tracked *.md with .markdownlint-cli2.jsonc,
#                   which excludes the read-only .docs/ and .template/
#                   trees. Non-blocking on day one (existing prose predates
#                   the gate; findings surface as warnings) — delete the
#                   continue-on-error below after the first docs cleanup
#                   pass to make it blocking.
#   * protected-dirs — fails any PR that edits .docs/ or .template/: those
#                   are verbatim delivered reference material, so an edit
#                   is a real defect, not a style choice. PR-only, diffed
#                   against the PR base commit.
#   * email-guard — fails if any email address outside the inline
#                   EXEMPTIONS list in the job below exists in a tracked
#                   file OR anywhere in git history. Owner's standing rule:
#                   never allow secrets or third-party personal addresses
#                   into history or files. Runs on every PR and every push
#                   to main. The same exemptions are stated in the
#                   stockloop-personal-email rule in .gitleaks.toml (sync
#                   the two when either changes).

name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install actionlint v1.7.12 (SHA-256 verified)
        run: |
          version=1.7.12
          tarball="actionlint_${version}_linux_amd64.tar.gz"
          curl -fsSL -o "${tarball}" "https://github.com/rhysd/actionlint/releases/download/v${version}/${tarball}"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  ${tarball}" | sha256sum -c -
          tar xzf "${tarball}"

      - name: Lint workflow files
        run: ./actionlint -no-color

  markdownlint:
    name: markdownlint (non-blocking)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint markdown
        id: mdlint
        continue-on-error: true # non-blocking on day one; see header
        run: npx --yes markdownlint-cli2@0.23.3

      - name: Surface findings as a warning
        if: steps.mdlint.outcome == 'failure'
        run: echo "::warning title=Markdown lint::markdownlint-cli2 reported issues (currently non-blocking). See the 'Lint markdown' step log; remove continue-on-error in quality.yml to enforce."

  protected-dirs:
    name: Guard .docs/ and .template/
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, so the PR base commit is available

      - name: Fail if the PR edits delivered reference material
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(git diff --name-only "${BASE_SHA}" HEAD -- .docs .template)
          if [ -n "${changed}" ]; then
            echo "::error title=Protected directory modified::.docs/ and .template/ are verbatim delivered reference material; editing them is a defect. Offending files:"
            printf '%s\n' "${changed}"
            exit 1
          fi
          echo "OK: .docs/ and .template/ untouched."

  email-guard:
    name: Email guard (tracked files + history)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history; the guard scans every commit

      - name: Fail on non-allowlisted emails in files or history
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          import sys

          # SSH remote host in scp-like `user@host:path` syntax (the
          # README clone URL: `git clone git@me.github.com:...`). It is a
          # host, not an email address — skipped, not allowlisted.
          NON_EMAIL_TOKENS = {"git@me.github.com"}

          # The approved set — no separate allowlist file. Keep in sync
          # with the stockloop-personal-email rule's allowlist in
          # .gitleaks.toml, where gitleaks users already look (gitleaks
          # cannot read this workflow, so the values are stated twice).
          # Glob form: `*` matches any run of non-@/non-space characters.
          EXEMPTIONS = [
              # Owner address that remains legitimately in tracked content:
              # CODE_OF_CONDUCT.md (enforcement contact) and
              # docs/gcp-setup.md (gcloud auth list transcript evidence).
              "perdana.rizki16@gmail.com",
              # GCP service-account identities — robots, not people.
              "*@*.iam.gserviceaccount.com",
              # RFC 2606/6761 reserved names — can never be real mailboxes.
              "*@example.test",    # e.g. orders@example.test
              "*@*.example.test",  # any subdomain of example.test
              "*@example.com",
              "*@*.example.com",
              # Documented placeholder addresses shipped in .template/.
              "orders@example.test",
              "supply@example.test",
              "jamie@example.test",
              "you@yourstore.com",
          ]

          # Greedy multi-label domain, lazy TLD + trailing guard: greedy
          # labels so multi-label hosts (*.iam.gserviceaccount.com) match
          # in full; lazy TLD + guard so a sentence-final period
          # (`...gmail.com.`) is not absorbed into the match.
          EMAIL_RE = re.compile(
              r"(?i)(?<![\w.+-])[A-Za-z0-9._%+-]+@(?:[A-Za-z0-9-]+\.)+[A-Za-z]{2,63}?"
              r"(?![A-Za-z0-9-])"
          )

          EXEMPTION_RX = [
              re.compile(
                  "^" + "".join("[^@\\s]+" if c == "*" else re.escape(c)
                                for c in e) + "$",
                  re.IGNORECASE,
              )
              for e in EXEMPTIONS
          ]

          def is_allowed(email):
              if email.lower() in NON_EMAIL_TOKENS:
                  return True
              return any(rx.match(email) for rx in EXEMPTION_RX)

          def scan_text(text):
              """[(lineno, email)] for every non-allowlisted email."""
              bad = []
              for lineno, line in enumerate(text.splitlines(), 1):
                  for m in EMAIL_RE.finditer(line):
                      if not is_allowed(m.group(0)):
                          bad.append((lineno, m.group(0)))
              return bad

          def git(*args):
              return subprocess.run(["git", *args], check=True,
                                    capture_output=True, text=True).stdout

          # Fail closed: an empty exemption set means the guard lost its
          # configuration, not that everything became allowed.
          if not EXEMPTIONS:
              print("::error title=email-guard::EXEMPTIONS is empty; "
                    "failing closed.")
              sys.exit(1)

          flagged = total = 0

          # 1. Every tracked file, whole content (not a diff).
          for path in git("ls-files").splitlines():
              if not os.path.isfile(path):
                  continue  # deleted but still in the index
              with open(path, encoding="utf-8", errors="replace") as fh:
                  text = fh.read()
              total += len(EMAIL_RE.findall(text))
              bad = scan_text(text)
              flagged += len(bad)
              for lineno, email in bad:
                  print(f"::error file={path},line={lineno}::non-allowlisted "
                        f"email '{email}' in tracked file — if legitimate, "
                        "add it to EXEMPTIONS here and to the "
                        "stockloop-personal-email allowlist in .gitleaks.toml.")

          # 2. Full history of every ref: commit headers, messages, and the
          #    content of every blob in every commit.
          sha = ""
          path = "(commit metadata)"
          hunk = False
          for line in git("log", "--all", "-p",
                          "--format=@@@COMMIT %H").splitlines():
              if line.startswith("@@@COMMIT "):
                  sha, path = line.split()[1], "(commit metadata)"
                  hunk = False
                  continue
              if line.startswith("diff --git"):
                  path, hunk = "(commit metadata)", False
                  continue
              if line.startswith("@@"):
                  hunk = True
                  continue
              # --- / +++ are headers only between diff --git and the
              # first hunk; inside a hunk they are ordinary content.
              if not hunk and line.startswith("+++ b/"):
                  path = line[6:]
                  continue
              if not hunk and line.startswith("--- "):
                  continue
              # Strip the +/- diff marker so it never joins the local part.
              content = line[1:] if line[:1] in ("+", "-") else line
              for m in EMAIL_RE.finditer(content):
                  total += 1
                  email = m.group(0)
                  if not is_allowed(email):
                      flagged += 1
                      print(f"::error title=Email in git history::commit {sha} "
                            f"({path}): non-allowlisted email '{email}'")

          print(f"SUMMARY: {total} email occurrences scanned; "
                f"{total - flagged} allowlisted, {flagged} flagged.")
          sys.exit(1 if flagged else 0)
          PY
