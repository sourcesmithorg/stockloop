# These directories do not exist yet — dependabot will begin acting on them
# once they land in the repo.
version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      web-dependencies:
        patterns:
          - "*"

  # pip reads pyproject.toml / uv.lock
  - package-ecosystem: pip
    directory: /api
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      api-dependencies:
        patterns:
          - "*"

  # Keeps the pinned action SHAs current
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns:
          - "*"

  # Covers compose.yaml
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      docker-images:
        patterns:
          - "*"
