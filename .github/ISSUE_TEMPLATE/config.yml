# blank_issues_enabled MUST stay true. SECURITY.md directs reporters to open a
# public GitHub issue, and the strict templates below cover only bug/feature
# shapes — with this set to false a reporter following SECURITY.md lands on the
# issue chooser with no blank-issue route and no way to report at all.
blank_issues_enabled: true
contact_links:
  - name: Security vulnerability
    url: https://github.com/sourcesmithorg/stockloop/blob/main/SECURITY.md
    about: What to include — and what never to include — in a security report.
