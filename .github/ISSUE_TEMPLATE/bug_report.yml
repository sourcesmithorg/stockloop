name: Bug report
description: Report a defect in StockLoop
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The observed behavior, including any error text.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What was expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Exact reproduction steps
      description: Numbered steps, concrete enough for someone else to follow.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: "OS, browser, Node/pnpm/Python versions — whatever applies."
      placeholder: "e.g. CachyOS, Firefox 141, Node 22, pnpm 10, Python 3.12"
    validations:
      required: true
  - type: dropdown
    id: affects-inventory
    attributes:
      label: Does it affect inventory data correctness?
      description: "e.g. wrong restock quantities, currency or unknown-value handling."
      options:
        - "No"
        - "Yes"
        - "Not sure"
    validations:
      required: true
  - type: checkboxes
    id: no-secrets
    attributes:
      label: Data check
      options:
        - label: I have not pasted real credentials or customer data.
          required: true
