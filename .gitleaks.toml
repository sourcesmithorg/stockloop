# StockLoop gitleaks configuration.
#
# Extends the gitleaks default ruleset and allowlists ONLY the documented
# placeholder credentials that ship in this repo's configuration templates.
# The job in .github/workflows/gitleaks.yml scans the FULL git history with
# this config and must exit non-zero on any real secret.
#
# Do not broaden these allowlists. Every entry below is deliberately narrow
# (anchored to the placeholder value itself, not to a file path) so that a
# real credential placed anywhere — including in .env.example — still reports.

title = "StockLoop gitleaks config"

  # Note: the AWS documentation example key `AKIAIOSFODNN7EXAMPLE` is not
  # flagged by any gitleaks version — the upstream aws-access-token rule
  # carries its own allowlist regex `.+EXAMPLE$` (real AWS keys never end
  # in EXAMPLE). CI detection is therefore verified with a
  # realistic-format fake key instead.

[extend]
  # Inherit the complete default ruleset (AWS keys, GitHub/Slack/Google
  # tokens, private keys, generic high-entropy tokens, etc.). Rules are
  # never removed; green CI must come from "no secrets", not from silence.
  useDefault = true

[[allowlists]]
  description = """
  POSTGRES_PASSWORD assignments whose value is the literal placeholder
  `change-me-locally` from .env.example (the documented configuration
  surface) and compose.yaml (local-dev default). This value is published
  on purpose and is not a secret. Only this exact assignment form with
  this exact placeholder is skipped: any other password value on the same
  key still reports.
  """
  regexes = ['''(?i)POSTGRES_PASSWORD\s*[=:][^\n]*change-me-locally''']

[[allowlists]]
  description = """
  Database URLs whose embedded password is the same documented placeholder
  (`...:change-me-locally@localhost:5433/...`, e.g. the DATABASE_URL line
  in .env.example, quoted in README/docs, or echoed by Makefile output).
  Only URLs carrying that exact placeholder password are skipped; a URL
  with any other embedded credential still reports.
  """
  regexes = ['''(?i)(?:postgres|postgresql)\+?\w*://[^\s/:@]+:change-me-locally@''']

[[rules]]
  id = "stockloop-personal-email"
  description = """
  Email address found anywhere in history that is not on the approved set.
  The same set is enforced independently by the `email-guard` job in
  .github/workflows/quality.yml, which carries it as an inline EXEMPTIONS
  list — there is deliberately no separate allowlist file. gitleaks cannot
  read another config, so the approved values are stated in both places;
  keep them in sync when either changes. The existing
  `change-me-locally` allowlists above are independent and untouched.
  """
  # Deliberately broad email shape: catching out-of-org addresses is the
  # point, so the allowlist (not the regex) carries the precision.
  # RE2 has no lookarounds, hence no `(?<!...)` guard here.
  regex = '''(?i)[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,63}'''

[[rules.allowlists]]
  description = """
  The approved email set, mirrored from the EXEMPTIONS list in the
  email-guard job of .github/workflows/quality.yml (sync manually).
  Every entry is anchored with `$` against the matched address, so a
  domain that merely ends with a reserved name but continues with
  attacker-controlled labels cannot ride the exemption. The SSH remote
  host `git@me.github.com` (README clone URL, scp-like `user@host:path`
  syntax) is excluded as a non-email, not approved as an address.
  """
  regexes = [
    # Owner address that remains legitimately in tracked content:
    # CODE_OF_CONDUCT.md (enforcement contact) and docs/gcp-setup.md
    # (gcloud auth list transcript evidence). SECURITY.md no longer
    # publishes it — reporting is a public issue now.
    '''(?i)perdana\.rizki16@gmail\.com$''',
    # SSH remote host in the README clone URL — not an email address.
    '''(?i)git@me\.github\.com$''',
    # RFC 2606/6761 reserved names: example.test / example.com and any
    # subdomain of them — can never be a real person's mailbox.
    '''(?i)[^@\s]+@(?:[A-Za-z0-9-]+\.)*example\.test$''',
    '''(?i)[^@\s]+@(?:[A-Za-z0-9-]+\.)*example\.com$''',
    # GCP service-account identities — robots, not people.
    '''(?i)[^@\s]+@[A-Za-z0-9.-]*\.iam\.gserviceaccount\.com$''',
    # Documented placeholder addresses shipped in .template/.
    '''(?i)orders@example\.test$''',
    '''(?i)supply@example\.test$''',
    '''(?i)jamie@example\.test$''',
    '''(?i)you@yourstore\.com$''',
    # sourcesmithorg members: add each member's address here AND to the
    # EXEMPTIONS list in quality.yml's email-guard job.
  ]
